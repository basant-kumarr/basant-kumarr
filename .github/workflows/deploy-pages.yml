name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        env:
          # Project pages serve from /<repo>/, not the domain root.
          VITE_BASE: /basant-kumarr/
        run: npm run build

      - name: Point canonical and Open Graph URLs at the Pages origin
        working-directory: site
        run: |
          SITE="https://basant-kumarr.github.io/basant-kumarr/"
          sed -i "s|https://basant-kumar-portfolio.netlify.app/|$SITE|g" dist/index.html
          sed -i "s|https://basant-kumar-portfolio.netlify.app/|$SITE|g" dist/sitemap.xml dist/robots.txt
          grep -c "$SITE" dist/index.html

      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site if it does not exist yet, so no manual
          # repository settings change is needed to go live.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
